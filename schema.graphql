schema {
  query: Query
  mutation: Mutation
}

type Query {
  listRepos(
    nextToken: String
  ): ReposPage!

  listScans(
    provider: String! 
    providerId: String!
    nextToken: String
  ): ScansPage!
}

type Mutation {
}

type ReposPage {
  repos: [Repo!]
  nextToken: String
}

type Repo {
  provider: String!
  providerId: String!
  name: String!
  fullName: String!
  private: Boolean!
  enabled: Boolean!
}

type ScansPage {
  scans: [Scan!]
  nextToken: String
}

type Scan {
  scanId: String!
  timestamp: String!
  pullRequest: PullRequest
  filesScanned: Int!
  issuesCount: Int!
  critical: Int!
  high: Int!
  medium: Int!
  low: Int!
  results: [ScanResult!]
}

type ScanResult {
  scanId: String!
  file: String!
  timestamp: String!
  issuesCount: Int!
  critical: Int!
  high: Int!
  medium: Int!
  low: Int!
  changes: Change!
  issues: [CodeIssue!]
}

type Change {
  additions: Int!
  deletions: Int!
  changeType: String!
  sha: String!
}

type CodeIssue {
  id: String!
  type: String!
  title: String!
  riskLevel: String!
  description: String
  impact: String
  recommendation: Recommendation
  cweId: String
  references: IssueReference
  location: IssueLocation!
}

type Recommendation {
  description: String!
  code: String
}

type IssueLocation {
  lineStart: Int!
  lineEnd: Int!
}

type IssueReference {
  standard: String
  ruleId: String
}

type PullRequest {
  id: String!
  number: Int!
  url: String!
  title: String!
  createdAt: String!
}
