schema {
  query: Query
  mutation: Mutation
}

type Query {
  getProfile: MyProfile!
}

type Mutation {
  connectRepo(repoId: ID!): Repo!
}

type Repo {
  id: ID!
  name: String!
}

type Tenant {
  id: ID!
  name: String!
}

type MyProfile {
  id: ID!
  name: String!
  email: AWSEmail!
}

type User {
  id: ID!
  name: String!
  email: AWSEmail!
}

enum TenantRole {
  Owner
  Member
  Viewer
}