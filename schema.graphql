schema {
  query: Query
  mutation: Mutation
}

type Query {
  getUsage: SubscriptionTierUsage!

  getStats(
    startDate: AWSDate!
    endDate: AWSDate!
  ): Stats!

  listRepos(
    nextToken: String
  ): ReposPage!

  getRepo(
    tenantRepoId: String!
  ): Repo

  listScans(
    tenantRepoId: String!
    nextToken: String
  ): ScansPage!

  getScan(
    tenantRepoId: String!
    scanId: String!
  ): Scan
}

type Mutation {
}

type ReposPage {
  repos: [Repo!]
  nextToken: String
}

type Repo {
  tenantRepoId: String!
  provider: String!
  providerRepoId: String!
  name: String!
  fullName: String!
  private: Boolean!
  enabled: Boolean!
}

type ScansPage {
  scans: [Scan!]
  nextToken: String
}

type Scan {
  scanId: String!
  timestamp: String!
  pullRequest: PullRequest
  filesScanned: Int!
  issuesCount: Int!
  critical: Int!
  high: Int!
  medium: Int!
  low: Int!
  results: [ScanResult!]
}

type ScanResult {
  scanId: String!
  file: String!
  timestamp: String!
  issuesCount: Int!
  critical: Int!
  high: Int!
  medium: Int!
  low: Int!
  changes: Change!
  issues: [CodeIssue!]
}

type Change {
  additions: Int!
  deletions: Int!
  changeType: String!
  sha: String!
}

type CodeIssue {
  id: String!
  type: String!
  title: String!
  riskLevel: String!
  description: String
  impact: String
  recommendation: Recommendation
  cweId: String
  references: IssueReference
  location: IssueLocation!
}

type Recommendation {
  description: String!
  code: String
}

type IssueLocation {
  lineStart: Int!
  lineEnd: Int!
}

type IssueReference {
  standard: String
  ruleId: String
}

type PullRequest {
  id: String!
  number: Int!
  url: String!
  title: String!
  createdAt: String!
}

type SubscriptionTierUsage {
  tier: String!
  scans: Int!
  limit: SubscriptionTierLimits!
}

type SubscriptionTierLimits {
  tier: String!
  scans: Int!
  filesPerScan: Int!
  maxFileSize: Int!
}

type Datum {
  scans: Int!
  filesScanned: Int!
  allIssues: Int!
  critical: Int!
  high: Int!
  medium: Int!
  low: Int!
  repos: Int!
}

type Stats {
  total: Datum!
  dailyStats: [DailyStats!]
}

type DailyStats {
  date: AWSDate!
  data: Datum!
}