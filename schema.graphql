schema {
  query: Query
  mutation: Mutation
}

type Query {
  listRepos(
    nextToken: String
  ): ReposPage!

  listScans(
    provider: String! 
    providerId: String!
    nextToken: String
  ): ScansPage!
}

type Mutation {
}

type ReposPage {
  repos: [Repo!]
  nextToken: String
}

type Repo {
  provider: String!
  providerId: String!
  name: String!
  fullName: String!
  private: Boolean!
  scans: ScansPage!
}

type ScansPage {
  scans: [Scan!]
  nextToken: String
}

type Scan {
  scanId: String!
  timestamp: String!
  pullRequest: PullRequest
  filesScanned: Int!
  issuesCount: Int!
  critical: Int!
  high: Int!
  medium: Int!
  low: Int!
}

type PullRequest {
  id: String!
  number: Int!
  url: String!
  title: String!
  createdAt: String!
}
